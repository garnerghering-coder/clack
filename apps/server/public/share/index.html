<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Clack</title>
  <link rel="stylesheet" href="/share-assets/maplibre-gl.css">
  <link rel="stylesheet" href="/share-assets/share.css">
</head>
<body>
  <div id="banner" class="banner" hidden>
    <div class="banner-text">
      <strong data-s="share.web.bannerTitle"></strong>
      <span data-s="share.web.bannerBody"></span>
    </div>
    <div class="banner-actions">
      <a id="get" class="btn primary" href="#" data-s="share.web.get"></a>
      <a id="open" class="btn" href="#" data-s="share.web.open"></a>
    </div>
    <p class="banner-note" data-s="share.web.installed"></p>
    <button id="dismiss" class="banner-close" type="button" aria-label="Close">×</button>
  </div>

  <main id="app" class="page" aria-live="polite">
    <p class="muted" data-s="share.web.loading"></p>
  </main>

  <footer class="foot">
    <span class="wordmark">clack</span>
    <a href="/privacy">Privacy</a>
  </footer>

  <script>window.CLACK_SHARE = /*CLACK_SHARE*/null;</script>
  <script src="/share-assets/maplibre-gl.js"></script>
  <script src="/share-assets/share.js"></script>
</body>
</html>
